# Render Blueprint — one-click deploy at:
# https://render.com/deploy?repo=https://github.com/sahilimamk/miniledger
#
# Creates a PostgreSQL database + a web service for the API.
# After deploy, set EXPO_PUBLIC_API_URL to the service URL when building the app.

databases:
  - name: miniledger-db
    databaseName: miniledger
    user: miniledger
    plan: free

services:
  - type: web
    name: miniledger-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Demo auth: this deployment has no SMS provider, so the API returns
      # the sign-in code in the /request-otp response and the client shows
      # it on screen, labelled DEMO. Set to 'false' (and wire a real SMS
      # provider) before treating this as production auth.
      - key: DEMO_AUTH
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: miniledger-db
          property: connectionString
