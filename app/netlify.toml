# Deploy the Expo web app to Netlify:
#   1. Set EXPO_PUBLIC_API_URL in Netlify env vars to your deployed API URL
#   2. Push to your repo — Netlify builds and deploys automatically

[build]
  command = "npx expo export --platform web"
  publish = "dist"

# SPA fallback: every unknown route serves index.html (React Navigation handles client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
