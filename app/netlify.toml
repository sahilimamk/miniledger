# Deploy the Expo web app to Netlify.
# The API URL is baked into app/src/config.ts (points to the live Render backend).
# Override by setting EXPO_PUBLIC_API_URL in Netlify's environment variables
# if you ever switch backends.

[build]
  command = "npx expo export --platform web"
  publish = "dist"

# SPA fallback: every unknown route serves index.html (React Navigation handles client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
